<!DOCTYPE html>
<html lang="ur-PK" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Ustad Lectures</title>
  <link rel="stylesheet" href="css/app.css">
  <script>
    window.MathJax = {
      loader: { load: [] },
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: false,
        macros: { XOR: '\\oplus', NOT: ['\\overline{#1}', 1] }
      },
      svg: { fontCache: 'global', scale: 1.0 },
      options: { enableMenu: false },
      startup: { typeset: false }
    };
  </script>
  <script src="vendor/mathjax/tex-svg.js" async></script>
</head>
<body>
  <div id="app"><div class="loading">Loading lectures...</div></div>
  <div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
