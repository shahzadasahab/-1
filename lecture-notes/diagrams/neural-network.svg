<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-label="Simple feedforward neural network">
  <text x="210" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Feedforward Neural Network</text>
  <g fill="#2563eb" stroke="#1d4ed8">
    <circle cx="60" cy="55" r="14"/><circle cx="60" cy="95" r="14"/><circle cx="60" cy="135" r="14"/>
    <text x="60" y="165" text-anchor="middle" font-size="10" fill="#64748b">Input</text>
    <circle cx="210" cy="45" r="14"/><circle cx="210" cy="90" r="14"/><circle cx="210" cy="135" r="14"/>
    <text x="210" y="165" text-anchor="middle" font-size="10" fill="#64748b">Hidden</text>
    <circle cx="360" cy="75" r="14"/><circle cx="360" cy="115" r="14"/>
    <text x="360" y="165" text-anchor="middle" font-size="10" fill="#64748b">Output</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1" opacity="0.7">
    <line x1="74" y1="55" x2="196" y2="45"/><line x1="74" y1="55" x2="196" y2="90"/>
    <line x1="74" y1="95" x2="196" y2="90"/><line x1="74" y1="135" x2="196" y2="135"/>
    <line x1="224" y1="45" x2="346" y2="75"/><line x1="224" y1="90" x2="346" y2="115"/>
    <line x1="224" y1="135" x2="346" y2="75"/>
  </g>
  <text x="210" y="178" text-anchor="middle" font-size="9" fill="#64748b">Weights adjusted during training (backpropagation in deep learning)</text>
</svg>
