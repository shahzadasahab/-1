<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-label="Discrete stairs versus continuous ramp">
  <defs>
    <linearGradient id="rampG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <text x="105" y="22" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#1a1a2e" font-weight="600">Discrete (Digital)</text>
  <text x="315" y="22" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#1a1a2e" font-weight="600">Continuous (Analog)</text>
  <g fill="#64748b" stroke="#475569" stroke-width="1.5">
    <rect x="30" y="160" width="150" height="8" fill="#94a3b8"/>
    <path d="M40 160 V140 H70 V160 M70 140 V115 H100 V160 M100 115 V90 H130 V160 M130 90 V65 H160 V160" fill="none" stroke="#2563eb" stroke-width="3"/>
    <circle cx="55" cy="132" r="5" fill="#dc2626"/>
    <circle cx="85" cy="107" r="5" fill="#dc2626"/>
    <text x="55" y="125" text-anchor="middle" font-size="10" fill="#64748b">step values only</text>
  </g>
  <g>
    <rect x="240" y="160" width="150" height="8" fill="#94a3b8"/>
    <line x1="250" y1="160" x2="380" y2="55" stroke="url(#rampG)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="310" cy="118" r="5" fill="#16a34a"/>
    <text x="310" y="110" text-anchor="middle" font-size="10" fill="#64748b">any height</text>
  </g>
</svg>
