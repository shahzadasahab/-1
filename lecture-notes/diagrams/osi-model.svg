<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" role="img" aria-label="OSI seven layer model">
  <defs>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <text x="140" y="24" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">OSI Model (7 Layers)</text>
  <g font-family="Segoe UI,sans-serif" font-size="11">
    <rect x="40" y="40" width="200" height="38" rx="4" fill="url(#layer)" stroke="#2563eb"/>
    <text x="140" y="63" text-anchor="middle" fill="#1a1a2e">7 Application  HTTP, DNS, SMTP</text>
    <rect x="40" y="82" width="200" height="38" rx="4" fill="url(#layer)" stroke="#2563eb"/>
    <text x="140" y="105" text-anchor="middle">6 Presentation  encoding, encryption</text>
    <rect x="40" y="124" width="200" height="38" rx="4" fill="url(#layer)" stroke="#2563eb"/>
    <text x="140" y="147" text-anchor="middle">5 Session  dialog control</text>
    <rect x="40" y="166" width="200" height="38" rx="4" fill="#93c5fd" stroke="#1d4ed8"/>
    <text x="140" y="189" text-anchor="middle" font-weight="600">4 Transport  TCP, UDP</text>
    <rect x="40" y="208" width="200" height="38" rx="4" fill="url(#layer)" stroke="#2563eb"/>
    <text x="140" y="231" text-anchor="middle">3 Network  IP, routing</text>
    <rect x="40" y="250" width="200" height="38" rx="4" fill="url(#layer)" stroke="#2563eb"/>
    <text x="140" y="273" text-anchor="middle">2 Data Link  MAC, frames</text>
    <rect x="40" y="292" width="200" height="38" rx="4" fill="url(#layer)" stroke="#2563eb"/>
    <text x="140" y="315" text-anchor="middle">1 Physical  cables, signals</text>
  </g>
  <text x="140" y="345" text-anchor="middle" font-size="10" fill="#64748b">Data encapsulation descends; decapsulation ascends</text>
</svg>
